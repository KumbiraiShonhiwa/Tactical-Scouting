name: test-and-lint

# Runs on every push/PR to main (CLAUDE.md §13, ADD §6.3). Phase 0/1 established the schema
# gate (migrations + pgTAP); Phase 2 added ETL lint/unit/integration jobs; Phase 3 added the
# FastAPI analysis service's; Phase 4 added the frontend's; Phase 5 adds the Edge Functions'.
# Playwright E2E is Phase 6.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (etl)
        run: ruff check etl/
      - name: Run ruff (api)
        run: ruff check api/

  unit-tests-etl:
    name: ETL unit tests (mypy --strict, pytest, no DB/network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install etl package + dev deps
        working-directory: etl
        run: pip install -e ".[dev]"
      - name: mypy --strict
        working-directory: etl
        run: mypy .
      - name: pytest (unit only — fixture-based, no live scraping per DC-07)
        working-directory: etl
        run: pytest tests/unit --cov=scrapers --cov=validators --cov=loader --cov-report=term-missing

  unit-tests-api:
    name: API unit tests (mypy --strict, pytest, no DB/network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install api package + dev deps
        working-directory: api
        run: pip install -e ".[dev]"
      - name: mypy --strict
        working-directory: api
        run: mypy .
      - name: pytest (unit only — no real DB, no real Supabase Auth)
        working-directory: api
        run: pytest tests/unit --cov=app --cov-report=term-missing

  lint-frontend:
    name: Lint frontend (eslint/tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check for frontend package.json
        id: check
        run: echo "exists=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install and lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck

  unit-tests-frontend:
    name: Frontend unit tests (Vitest + RTL, MSW-mocked network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend package + dev deps
        working-directory: frontend
        run: npm ci
      - name: vitest (unit/component — MSW-mocked PostgREST/FastAPI, no live backend)
        working-directory: frontend
        run: npm run test -- --coverage

  unit-tests-functions:
    name: Edge Functions unit tests (Deno, pure-logic pieces only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno test (no network, no Supabase stack — see each function's index.test.ts)
        working-directory: supabase/functions
        run: deno test --no-check */index.test.ts

  migrations-and-rls:
    name: Apply migrations + seed + pgTAP (ephemeral Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations and seed (db reset)
        run: supabase db reset
      - name: Run pgTAP test suite
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  integration-tests-etl:
    name: ETL integration tests (loader vs ephemeral Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install etl package + dev deps
        working-directory: etl
        run: pip install -e ".[dev]"
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations and seed (db reset)
        run: supabase db reset
      - name: pytest (integration — real local Postgres, no mocked RLS/DB behavior)
        working-directory: etl
        run: pytest tests/integration --no-cov
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  integration-tests-api:
    name: API integration tests (real local Supabase + real Auth test users)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install api package + dev deps
        working-directory: api
        run: pip install -e ".[dev]"
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations and seed (db reset)
        run: supabase db reset
      - name: pytest (integration — real DB, real Supabase Auth JWKS verification)
        working-directory: api
        run: pytest tests/integration --no-cov
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-smoke:
    name: E2E smoke (Playwright, one test per UC — required PR check)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_JWKS_URL: http://127.0.0.1:54321/auth/v1/.well-known/jwks.json
      RATE_LIMIT_PER_MINUTE: "60"
      GITHUB_TOKEN: unused-e2e-server-stubs-the-real-call
      GITHUB_REPO: unused-e2e-server-stubs-the-real-call
      INTERNAL_FUNCTION_SECRET: e2e-ci-internal-secret
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      VITE_API_BASE_URL: http://127.0.0.1:8000
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write supabase/functions/.env (Phase 5 Edge Functions, local demo values only)
        run: |
          cat > supabase/functions/.env <<EOF
          API_BASE_URL=http://host.docker.internal:8000
          PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          INTERNAL_FUNCTION_SECRET=${{ env.INTERNAL_FUNCTION_SECRET }}
          PIPELINE_WEBHOOK_SECRET=e2e-ci-webhook-secret
          EOF
      - name: Start local Supabase stack
        run: supabase start
      - name: Apply migrations and seed (db reset)
        run: supabase db reset
      - name: One-time Vault setup for the recompute-fit-scores trigger (Phase 5)
        run: psql "$SUPABASE_DB_URL" -f supabase/e2e-vault-setup.sql
      - name: Install and start the API (e2e_server.py — GitHub dispatch stubbed, see the file's docstring)
        working-directory: api
        run: |
          pip install -e ".[dev]"
          nohup python e2e_server.py > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Install frontend deps (Playwright's webServer builds it fresh)
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps + Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke suite (E2E-01..05 only, Desktop Chrome)
        working-directory: e2e
        run: npx playwright test tests/e2e-*.spec.ts --project=chromium-smoke
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: e2e/playwright-report/
          retention-days: 14
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  # --- Not yet implemented (added as each phase lands) ---
