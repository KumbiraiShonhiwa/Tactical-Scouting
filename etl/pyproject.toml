[project]
name = "tactical-scouting-etl"
version = "0.1.0"
description = "ETL pipeline for Tactical-Scouting: extract, validate, and load football data."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["scrapers", "validators", "loader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
